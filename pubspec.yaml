name: katsklub_flutter
description: Flutter mobile app for KatsKlub
publish_to: none
version: 1.0.12+2053

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & Utilities
  http: ^1.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  mime: ^2.0.0
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.5.2

  # Firebase & Authentication
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  google_sign_in: ^6.2.2

  # Networking & Real-time
  socket_io_client: ^3.1.4

  # Media & Audio / Video
  audioplayers: ^6.1.0
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  video_player: ^2.9.2
  chewie: ^1.13.1
  record: ^6.2.1
  speech_to_text: ^7.4.0
  youtube_explode_dart: ^3.1.0
  flutter_webrtc: ^0.12.5

  # Camera & File Pickers
  camerawesome: ^2.4.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # UI, Fonts & Animations
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  google_fonts: ^6.2.1
  lottie: ^3.3.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_svga: '>=0.0.4 <0.1.0'
  syncfusion_flutter_chat: ^34.1.33
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/nocomment.svg
    - assets/images/kb.svg
    - assets/images/kb_light.svg
    - assets/images/rp.svg
    - assets/images/rp1.svg
    - assets/images/rp2.svg
    - assets/images/rp3.svg
    - assets/images/rp4.png
    - assets/images/top.svg
    - assets/images/top1.svg
    - assets/images/top2.png
    - assets/images/kats-logo-final.png
    - assets/images/default_avatar_cat.jpg
    - assets/images/default_avatar_dog.jpg
    - assets/images/default_avatar_panda.jpg
    - assets/images/default_avatar_bunny.jpg
    - assets/images/achievement_pill_preview_v1.png
    - assets/images/achievement_pill_preview_v1_trimmed.png
    - assets/images/borders/
    - assets/sounds/message_in.mp3
    - assets/sounds/message_out.mp3
    - assets/sounds/notification_in.mp3
    - assets/frames/aframe.png
    - assets/frames/bframe.png
    - assets/frames/cframe.png
    - assets/frames/wing_frame.json
    - assets/frames/test_frame.json
    - assets/frames/spring_blossom_frame.png
    - assets/frames/spring_blossom_frame.svga
    - assets/frames/spring_blossom_frame.webp
    - assets/frames/images/
    - assets/animations/empty_status.json
    - assets/images/erhai_bg.png
    - assets/gifts/

  fonts:
    - family: SF Pro Rounded
      fonts:
        - asset: assets/fonts/SFProRounded/SFProRounded-Light.ttf
          weight: 300
        - asset: assets/fonts/SFProRounded/SFProRounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProRounded/SFProRounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProRounded/SFProRounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProRounded/SFProRounded-Black.ttf
          weight: 900
    - family: HarmonyOS Sans
      fonts:
        - asset: assets/fonts/HarmonyOSSans/HarmonyOS_Sans_Thin.ttf
          weight: 100
        - asset: assets/fonts/HarmonyOSSans/HarmonyOS_Sans_Light.ttf
          weight: 300
        - asset: assets/fonts/HarmonyOSSans/HarmonyOS_Sans_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOSSans/HarmonyOS_Sans_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOSSans/HarmonyOS_Sans_Bold.ttf
          weight: 700
        - asset: assets/fonts/HarmonyOSSans/HarmonyOS_Sans_Black.ttf
          weight: 900
