<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 24" width="110" height="24" fill="none">
  <defs>
    <!-- Pill Background Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="50%" stop-color="#FFAE33"/>
      <stop offset="100%" stop-color="#FEDB37"/>
    </linearGradient>
    
    <!-- Glossy Overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Badge Circle Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#C2410C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Pill Shape -->
  <rect x="0.5" y="0.5" width="109" height="23" rx="11.5" fill="url(#pillBg)" stroke="#EA580C" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Gloss Layer -->
  <rect x="0.5" y="0.5" width="109" height="23" rx="11.5" fill="url(#gloss)"/>

  <!-- Left Coin Badge -->
  <g transform="translate(3, 3)">
    <circle cx="9" cy="9" r="8.5" fill="url(#badgeBg)" stroke="#EA580C" stroke-width="1"/>
    <circle cx="9" cy="9" r="7" stroke="#F97316" stroke-width="0.6" stroke-opacity="0.5" fill="none"/>
    
    <!-- Paw Icon Inside Badge -->
    <g transform="translate(9, 9) scale(0.65)" fill="#EA580C">
      <!-- Toes -->
      <circle cx="-4.5" cy="-3.5" r="1.6"/>
      <circle cx="-1.5" cy="-5.5" r="1.6"/>
      <circle cx="1.5" cy="-5.5" r="1.6"/>
      <circle cx="4.5" cy="-3.5" r="1.6"/>
      <!-- Main Pad -->
      <path d="M0 -1 C-2.8 -1 -4.8 0.8 -4.8 3 C-4.8 4.8 -2.8 5.8 0 5.8 C2.8 5.8 4.8 4.8 4.8 3 C4.8 0.8 2.8 -1 0 -1 Z"/>
    </g>
  </g>

  <!-- Text: Rising Paw -->
  <g filter="url(#glow)">
    <text x="26" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">Rising Paw</text>
  </g>
</svg>