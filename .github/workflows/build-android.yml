name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Flutter Android files
        run: flutter create . --platforms=android --org com.katsklub --project-name katsklub_flutter

      - name: Add Android internet permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"
      
      - name: Install dependencies
        run: flutter pub get

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --split-per-abi --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: katsklub-flutter-apks
          path: build/app/outputs/flutter-apk/*.apk
