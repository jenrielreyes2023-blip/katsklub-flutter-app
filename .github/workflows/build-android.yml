name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rescue-lost-1d1b

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
  JAVA_OPTS: "-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Flutter Android files
        run: flutter create . --platforms=android --org com.katsklub --project-name katsklub_flutter

      - name: Add Android internet permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"
      
      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --split-per-abi --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: katsklub-flutter-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      - name: Upload APK fallback to tmpfiles.org
        if: always()
        run: |
          for apk in build/app/outputs/flutter-apk/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              echo "Uploading $filename..."
              response=$(curl -s -F "file=@$apk" https://tmpfiles.org/api/v1/upload)
              url=$(echo "$response" | grep -o '"url":"[^"]*' | cut -d'"' -f4)
              if [ -n "$url" ]; then
                dl_url=$(echo "$url" | sed 's/tmpfiles.org/tmpfiles.org\/dl/')
                echo "--------------------------------------------------------"
                echo "DOWNLOAD LINK for $filename:"
                echo "$dl_url"
                echo "--------------------------------------------------------"
              else
                echo "Failed to upload $filename. Response: $response"
              fi
            fi
          done
