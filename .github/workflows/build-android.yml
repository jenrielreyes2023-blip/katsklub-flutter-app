name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_OPTS: "-Xmx4096m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Android APK (ARM64 Release)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: katsklub-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Deploy APK to https://katsklub.top/katsklub-latest.apk
        continue-on-error: true
        run: |
          echo "Deploying APK to server..."
          curl -s -X POST https://katsklub.top/api/admin/deploy-apk \
            -H "x-deploy-token: katsklub_apk_secret_2026" \
            -F "apk=@build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          echo "Deployment step completed."
