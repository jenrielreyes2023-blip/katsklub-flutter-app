name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rescue-lost-1d1b

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_OPTS: "-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-sdk-${{ runner.arch }}
          restore-keys: |
            ${{ runner.os }}-flutter-sdk-

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Flutter Android files
        run: flutter create . --platforms=android --org com.katsklub --project-name katsklub_flutter

      - name: Add Android internet permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (Single Arch)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katsklub-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Deploy APK to VPS via SCP
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          target: "/var/www/katsklub/"
          strip_components: 4

      - name: Update APK link on VPS
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            mv -f /var/www/katsklub/app-arm64-v8a-release.apk /var/www/katsklub/katsklub-latest.apk
            chmod 644 /var/www/katsklub/katsklub-latest.apk
